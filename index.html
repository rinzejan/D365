<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D365 FO Search Hub</title>
    <style>
      :root {
        --primary: #0078d4;
        --primary-hover: #106ebe;
        --bg: #f0f2f5;
        --surface: #ffffff;
        --text-main: #323130;
        --text-sec: #605e5c;
        --border: #e1dfdd;
        --focus: #0078d4;
        --shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132); /* lighter shadow */
        --radius: 4px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: var(--text-main);
        background-color: var(--bg);
        height: 100vh;
        overflow: hidden; /* Prevent body scroll, layout fits screen */
      }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 16px 24px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      header {
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        color: var(--primary);
      }

      .tagline {
        color: var(--text-sec);
        font-size: 13px;
      }

      /* Main layout for side-by-side panels */
      .layout-grid {
        display: grid;
        grid-template-columns: 1.6fr 1fr; /* Left panel wider */
        gap: 16px;
        flex: 1;
        min-height: 0; /* Important for scroll */
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 16px 20px;
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        color: var(--text-sec);
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 4px;
        flex-shrink: 0;
      }

      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      /* Compact inputs */
      label {
        display: block;
        font-weight: 600;
        font-size: 11px;
        margin-bottom: 4px;
        color: var(--text-sec);
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #8a8886;
        border-radius: var(--radius);
        font-size: 13px;
        background: var(--surface);
        height: 30px;
        outline: none;
      }

      input[type="text"]:focus, select:focus {
        border-color: var(--primary);
      }

      /* Chips compact */
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        font-size: 12px;
        user-select: none;
        background: #faf9f8;
      }
      
      .chip:hover { background: #f3f2f1; }
      .chip:has(input:checked) {
        background: #eff6fc; border-color: var(--primary); color: var(--primary); font-weight: 600;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: auto; /* Push to bottom */
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      button {
        background: var(--primary);
        color: #fff;
        border: none;
        font-weight: 600;
        font-size: 12px;
        padding: 0 16px;
        height: 32px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button:hover { opacity: 0.9; }
      button.secondary { background: #f3f2f1; color: var(--text-main); }

      .preview {
        margin-top: 12px;
        font-size: 11px;
        color: var(--text-sec);
        background: #f9f9f9;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        font-family: Consolas, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      @media (max-width: 900px) {
        body { overflow: auto; height: auto; }
        .layout-grid { grid-template-columns: 1fr; }
        .wrap { height: auto; }
      }

      /* Tip Card Styles */
      .tip-panel {
        background: #f8fbfd; /* Very subtle blue tint */
        border-left: 3px solid var(--primary);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .tip-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .tip-badge {
        background: var(--primary);
        color: white;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
        text-transform: uppercase;
      }
      .tip-title {
        font-weight: 600;
        color: var(--text-main);
        font-size: 13px;
        margin: 0;
      }
      .tip-content {
        font-size: 12px;
        color: var(--text-sec);
        margin-bottom: 12px;
        line-height: 1.4;
      }
      .tip-link {
        font-size: 11px;
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
      }
      .tip-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>D365 FO Hub</h1>
          <div class="tagline">Version intelligence & community knowledge</div>
        </div>
      </header>

      <div class="layout-grid">
        <section class="panel">
          <span class="section-title">Version & Feature Search</span>
          <div class="grid">
            <div style="grid-column: 1/-1">
            <label for="keyword">Keywords</label>
            <input
              id="keyword"
              type="text"
              placeholder="e.g., credit limits, vendor invoice workflow"
            />
          </div>
          <div>
            <label for="product">Product</label>
            <select id="product">
              <option value="Dynamics 365 Finance and Operations">Finance and Operations</option>
              <option value="Dynamics 365 Finance">Finance</option>
              <option value="Dynamics 365 Supply Chain Management">Supply Chain Management</option>
            </select>
          </div>
          <div>
            <label for="version">Version</label>
            <select id="version">
              <option value="">Any</option>
              <optgroup label="Future Release Waves">
                <option value="2028 release wave 2">2028 release wave 2</option>
                <option value="2028 release wave 1">2028 release wave 1</option>
                <option value="2027 release wave 2">2027 release wave 2</option>
                <option value="2027 release wave 1">2027 release wave 1</option>
                <option value="2026 release wave 2">2026 release wave 2</option>
                <option value="2026 release wave 1">2026 release wave 1</option>
              </optgroup>
              <optgroup label="Projected Versions">
                <option value="10.0.57">10.0.57 (Projected)</option>
                <option value="10.0.56">10.0.56 (Projected)</option>
                <option value="10.0.55">10.0.55 (Projected)</option>
                <option value="10.0.54">10.0.54 (Projected)</option>
                <option value="10.0.53">10.0.53 (Projected)</option>
                <option value="10.0.52">10.0.52 (Projected)</option>
                <option value="10.0.51">10.0.51 (Projected)</option>
                <option value="10.0.50">10.0.50 (Projected)</option>
              </optgroup>
              <optgroup label="Current & Recent Updates">
                <option value="2025 release wave 2">2025 release wave 2</option>
                <option value="2025 release wave 1">2025 release wave 1</option>
                <option value="10.0.49">10.0.49</option>
                <option value="10.0.48">10.0.48</option>
                <option value="10.0.47">10.0.47</option>
                <option value="10.0.46">10.0.46</option>
                <option value="10.0.45">10.0.45</option>
                <option value="10.0.44">10.0.44</option>
                <option value="10.0.43">10.0.43</option>
                <option value="10.0.42">10.0.42</option>
                <option value="10.0.41">10.0.41</option>
                <option value="10.0.40">10.0.40</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label for="module">Module</label>
            <select id="module">
              <option value="">Any</option>
              <option value="General ledger">General ledger</option>
              <option value="Accounts payable">Accounts payable</option>
              <option value="Accounts receivable">Accounts receivable</option>
              <option value="Cash and bank management">Cash and bank management</option>
              <option value="Procurement and sourcing">Procurement and sourcing</option>
              <option value="Inventory management">Inventory management</option>
            </select>
          </div>
          <div>
            <label for="scope">Scope</label>
            <select id="scope">
              <option value="learn">Microsoft Learn only</option>
              <option value="learn+community">Learn + Community</option>
            </select>
          </div>
          <div>
            <label for="engine">Search engine</label>
            <select id="engine">
              <option value="bing">Bing</option>
              <option value="google">Google</option>
              <option value="ddg">DuckDuckGo</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label>Status</label>
          <div class="row" style="margin-top: 8px;">
            <label class="chip"><input type="checkbox" id="status-new" /> New</label>
            <label class="chip"><input type="checkbox" id="status-deprecated" /> Deprecated</label>
            <label class="chip"><input type="checkbox" id="status-removed" /> Removed</label>
            <label class="chip"><input type="checkbox" id="status-changed" /> Changed</label>
          </div>
        </div>

        <div class="actions">
          <button id="search">Search</button>
          <button id="copy" class="secondary">Copy Query</button>
        </div>

        <div class="preview" id="preview"></div>
        </section> <!-- Close Left Panel -->

        <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
          <section class="panel" style="flex: 0 0 auto;"> <!-- Top Right: Topic Search -->
            <span class="section-title">Community & Topic Explorer</span>
            <div class="grid">
              <div style="grid-column: 1 / -1;">
                <label for="topic-keyword">Topic</label>
                <input
                  id="topic-keyword"
                  type="text"
                  placeholder="e.g. Advanced warehousing"
                />
              </div>
              <div style="grid-column: 1 / -1;">
                <label for="topic-source">Source</label>
                <select id="topic-source">
                  <option value="blogs">Blogs & Guides (Community)</option>
                  <option value="official">Official Docs (Microsoft)</option>
                  <option value="all">All Sources</option>
                </select>
              </div>
              <div style="grid-column: 1 / -1;">
                <label for="topic-recency">Recency</label>
                <select id="topic-recency">
                  <option value="">Any time</option>
                  <option value="y">Past Year</option>
                  <option value="m">Past Month</option>
                </select>
              </div>
            </div>

            <div class="actions">
              <button id="topic-search">Find Topics</button>
            </div>
          </section>

          <section class="panel tip-panel" id="tip-card" style="flex: 1;">
            <!-- Tip content injected by JS -->
          </section>
        </div>
      </div> <!-- Close Layout Grid -->
    </div> <!-- Close Wrap -->

    <script>
      // === TIPS DATA ===
      const d365Tips = [
        {
          title: "Saved Views & Personalization",
          text: "You can publish Saved Views to specific security roles, ensuring users start with the exact columns and filters they need for their job function.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/fin-ops/get-started/saved-views"
        },
        {
          title: "Regression Suite Automation Tool (RSAT)",
          text: "Don't just record tasks—automate them. RSAT lets you use Task Recorder recordings to build automated regression tests without writing code.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/perf-test/rsat/rsat-overview"
        },
        {
          title: "Feature Management",
          text: "New features often land in a 'Disabled' state. Check the Feature Management workspace regularly to enable preview features before they become mandatory.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/fin-ops/get-started/feature-management/feature-management-overview"
        },
        {
          title: "Open in Excel",
          text: "The 'Open in Excel' feature isn't just for viewing. You can use it to mass-update records (like Journals or Master Data) and publish changes back to D365FO.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/office-integration/use-excel-add-in"
        },
        {
          title: "Business Events",
          text: "Need to trigger a Power Automate flow when a Sales Order is confirmed? Use Business Events to send signals to external systems without custom code.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/business-events/home-page"
        },
        {
          title: "Evaluating Performance",
          text: "Use the 'Performance timer' (append &debug=develop:1 to URL) to see exactly which server calls or SQL queries are slowing down your form.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/perf-test/performance-timer"
        },
        {
          title: "Trace Parser",
          text: "For deep debugging, capture a trace and analyze it with Trace Parser. It's the ultimate tool for finding the root cause of slow X++ processes.",
          link: "https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/perf-test/trace-trace-tutorial"
        }
      ];

      // === RENDER TIP ===
      const renderTip = () => {
        const tipIndex = Math.floor(Math.random() * d365Tips.length);
        const tip = d365Tips[tipIndex];
        
        const html = `
          <div class="tip-header">
            <span class="tip-badge">Tip of the Day</span>
            <h3 class="tip-title">${tip.title}</h3>
          </div>
          <div class="tip-content">${tip.text}</div>
          <a href="${tip.link}" target="_blank" rel="noopener" class="tip-link">Read more details &rarr;</a>
        `;
        document.getElementById('tip-card').innerHTML = html;
      };

      // Initialize Tip
      renderTip();

      const el = (id) => document.getElementById(id);

      const buildQuery = () => {
        const product = el("product").value;
        const version = el("version").value;
        const module = el("module").value;
        const keyword = el("keyword").value.trim();
        const scope = el("scope").value;

        const terms = [];
        terms.push('site:learn.microsoft.com');
        if (scope === "learn+community") {
          terms.push('OR site:community.dynamics.com');
        }
        terms.push(`"${product}"`);

        if (version) {
          terms.push(`"${version}"`);
        }

        if (module) {
          terms.push(`"${module}"`);
        }

        if (keyword) {
          terms.push(keyword);
        }

        if (el("status-new").checked) {
          terms.push('"what\'s new"');
        }
        if (el("status-deprecated").checked) {
          terms.push("deprecated");
        }
        if (el("status-removed").checked) {
          terms.push("removed");
        }
        if (el("status-changed").checked) {
          terms.push("changed");
        }

        return terms.join(" ");
      };

      const buildUrl = (query) => {
        const engine = el("engine").value;
        const q = encodeURIComponent(query);
        if (engine === "google") {
          return `https://www.google.com/search?q=${q}`;
        }
        if (engine === "ddg") {
          return `https://duckduckgo.com/?q=${q}`;
        }
        return `https://www.bing.com/search?q=${q}`;
      };

      const updatePreview = () => {
        const query = buildQuery();
        const url = buildUrl(query);
        el("preview").textContent = `Query: ${query} | URL: ${url}`;
      };

      document.addEventListener("input", updatePreview);

      el("search").addEventListener("click", () => {
        const url = buildUrl(buildQuery());
        window.open(url, "_blank", "noopener");
      });

      el("copy").addEventListener("click", async () => {
        const query = buildQuery();
        try {
          await navigator.clipboard.writeText(query);
          el("preview").textContent = "Query copied to clipboard.";
        } catch (error) {
          el("preview").textContent = "Copy failed. You can manually copy the query above.";
        }
      });

      // Topic Search Logic
      el("topic-search").addEventListener("click", () => {
        const keyword = el("topic-keyword").value.trim();
        const source = el("topic-source").value;
        const recency = el("topic-recency").value;
        const engine = el("engine").value;

        if (!keyword) {
          alert("Please enter a topic.");
          return;
        }

        const terms = [];
        terms.push('("Dynamics 365 Finance" OR "Dynamics 365 Supply Chain" OR "D365FO")');
        terms.push(`"${keyword}"`);

        if (source === "blogs") {
          terms.push('(blog OR guide OR tutorial OR "how to" OR walkthrough)');
        } else if (source === "official") {
          terms.push('site:learn.microsoft.com');
        }

        const query = terms.join(" ");
        const q = encodeURIComponent(query);
        let url = "";

        if (engine === "google") {
          url = `https://www.google.com/search?q=${q}`;
          if (recency) url += `&tbs=qdr:${recency}`;
        } else if (engine === "ddg") {
          url = `https://duckduckgo.com/?q=${q}`;
          if (recency) url += `&df=${recency}`;
        } else {
          // Bing
          url = `https://www.bing.com/search?q=${q}`;
          if (recency === "m") {
             url += "&filters=ex1%3a%22ez3%22"; // Past month
          }
        }

        window.open(url, "_blank", "noopener");
      });

      updatePreview();
    </script>
  </body>
</html>
