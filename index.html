<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D365 FO Search Hub</title>
    <style>
      :root {
        --primary: #0078d4;
        --primary-hover: #106ebe;
        --bg: #f0f2f5;
        --surface: #ffffff;
        --text-main: #323130;
        --text-sec: #605e5c;
        --border: #e1dfdd;
        --focus: #0078d4;
        --shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132), 0 0.3px 0.9px 0 rgba(0,0,0,.108);
        --shadow-lg: 0 6.4px 14.4px 0 rgba(0,0,0,.132), 0 1.2px 3.6px 0 rgba(0,0,0,.108);
        --radius: 6px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        color: var(--text-main);
        background-color: var(--bg);
        line-height: 1.5;
        padding-bottom: 60px;
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      header {
        margin-bottom: 32px;
        text-align: center;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 32px;
        font-weight: 600;
        color: var(--text-main);
      }

      .tagline {
        color: var(--text-sec);
        font-size: 18px;
        font-weight: 400;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
        padding: 32px;
        border-radius: 8px;
        margin-bottom: 40px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      
      .panel:focus-within {
        border-color: var(--primary);
      }

      .section-title {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        color: var(--text-sec);
        margin-bottom: 24px;
        display: block;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }

      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      /* Form Elements */
      label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
        color: var(--text-main);
      }

      input[type="text"],
      select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #8a8886;
        border-radius: var(--radius);
        font-size: 14px;
        font-family: inherit;
        background: var(--surface);
        color: var(--text-main);
        transition: all 0.2s;
        outline: none;
      }

      input[type="text"]:focus,
      select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
      }
      
      select:hover, input[type="text"]:hover {
        border-color: var(--text-main);
      }

      /* Status Chips (Checkbox styling) */
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      
      .chip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: transparent;
        border: 1px solid var(--text-sec);
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
        user-select: none;
      }

      .chip input {
        display: none; /* Hide actual checkbox */
      }

      .chip:hover {
        background-color: #f3f2f1;
        border-color: var(--text-main);
      }

      /* Style when checked - we use JS to toggle class or CSS :has if supported, 
         but for broad support let's rely on :checked + span visual or just style label based on nested input */
      .chip:has(input:checked) {
        background-color: #eff6fc; /* Light blue */
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }
      /* Fallback for browsers without :has support */
      .chip input:checked + span {
          /* Can be handled if we wrapped text in span, simpler to just assume standard usage */
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: #fff;
        border: none;
        font-family: inherit;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 24px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background-color 0.2s;
        min-width: 100px;
      }

      button:hover {
        background-color: var(--primary-hover);
        box-shadow: var(--shadow-sm);
      }

      button.secondary {
        background: var(--surface);
        color: var(--text-main);
        border: 1px solid #8a8886;
      }

      button.secondary:hover {
        background-color: #f3f2f1;
      }

      .preview {
        margin-top: 20px;
        font-size: 13px;
        color: var(--text-sec);
        background: #f9f9f9;
        padding: 12px;
        border-radius: 4px;
        border: 1px dashed var(--border);
        font-family: Consolas, monospace;
        word-break: break-all;
      }

      @media (max-width: 640px) {
        .wrap { padding: 24px 16px; }
        .grid { grid-template-columns: 1fr; }
        .actions { flex-direction: column; }
        button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>D365 FO Hub</h1>
        <div class="tagline">
          Version intelligence & community knowledge base
        </div>
      </header>

      <section class="panel">
        <span class="section-title">Version & Feature Search</span>
        <div class="grid">
          <div style="grid-column: 1/-1">
            <label for="keyword">Keywords</label>
            <input
              id="keyword"
              type="text"
              placeholder="e.g., credit limits, vendor invoice workflow"
            />
          </div>
          <div>
            <label for="product">Product</label>
            <select id="product">
              <option value="Dynamics 365 Finance and Operations">Finance and Operations</option>
              <option value="Dynamics 365 Finance">Finance</option>
              <option value="Dynamics 365 Supply Chain Management">Supply Chain Management</option>
            </select>
          </div>
          <div>
            <label for="version">Version</label>
            <select id="version">
              <option value="">Any</option>
              <optgroup label="Future Release Waves">
                <option value="2028 release wave 2">2028 release wave 2</option>
                <option value="2028 release wave 1">2028 release wave 1</option>
                <option value="2027 release wave 2">2027 release wave 2</option>
                <option value="2027 release wave 1">2027 release wave 1</option>
                <option value="2026 release wave 2">2026 release wave 2</option>
                <option value="2026 release wave 1">2026 release wave 1</option>
              </optgroup>
              <optgroup label="Projected Versions">
                <option value="10.0.57">10.0.57 (Projected)</option>
                <option value="10.0.56">10.0.56 (Projected)</option>
                <option value="10.0.55">10.0.55 (Projected)</option>
                <option value="10.0.54">10.0.54 (Projected)</option>
                <option value="10.0.53">10.0.53 (Projected)</option>
                <option value="10.0.52">10.0.52 (Projected)</option>
                <option value="10.0.51">10.0.51 (Projected)</option>
                <option value="10.0.50">10.0.50 (Projected)</option>
              </optgroup>
              <optgroup label="Current & Recent Updates">
                <option value="2025 release wave 2">2025 release wave 2</option>
                <option value="2025 release wave 1">2025 release wave 1</option>
                <option value="10.0.49">10.0.49</option>
                <option value="10.0.48">10.0.48</option>
                <option value="10.0.47">10.0.47</option>
                <option value="10.0.46">10.0.46</option>
                <option value="10.0.45">10.0.45</option>
                <option value="10.0.44">10.0.44</option>
                <option value="10.0.43">10.0.43</option>
                <option value="10.0.42">10.0.42</option>
                <option value="10.0.41">10.0.41</option>
                <option value="10.0.40">10.0.40</option>
              </optgroup>
            </select>
          </div>
          <div>
            <label for="module">Module</label>
            <select id="module">
              <option value="">Any</option>
              <option value="General ledger">General ledger</option>
              <option value="Accounts payable">Accounts payable</option>
              <option value="Accounts receivable">Accounts receivable</option>
              <option value="Cash and bank management">Cash and bank management</option>
              <option value="Procurement and sourcing">Procurement and sourcing</option>
              <option value="Inventory management">Inventory management</option>
            </select>
          </div>
          <div>
            <label for="scope">Scope</label>
            <select id="scope">
              <option value="learn">Microsoft Learn only</option>
              <option value="learn+community">Learn + Community</option>
            </select>
          </div>
          <div>
            <label for="engine">Search engine</label>
            <select id="engine">
              <option value="bing">Bing</option>
              <option value="google">Google</option>
              <option value="ddg">DuckDuckGo</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 16px;">
          <label>Status</label>
          <div class="row" style="margin-top: 8px;">
            <label class="chip"><input type="checkbox" id="status-new" /> New</label>
            <label class="chip"><input type="checkbox" id="status-deprecated" /> Deprecated</label>
            <label class="chip"><input type="checkbox" id="status-removed" /> Removed</label>
            <label class="chip"><input type="checkbox" id="status-changed" /> Changed</label>
          </div>
        </div>

        <div class="actions">
          <button id="search">Search</button>
          <button id="copy" class="secondary">Copy Query</button>
        </div>

        <div class="preview" id="preview"></div>
      </section>

      <section class="panel">
        <span class="section-title">Community & Topic Explorer</span>
        <div class="grid">
          <div style="grid-column: 1 / -1;">
            <label for="topic-keyword">Topic</label>
            <input
              id="topic-keyword"
              type="text"
              placeholder="e.g. Advanced warehousing, Year end close, Asset leasing"
            />
          </div>
          <div>
            <label for="topic-source">Source</label>
            <select id="topic-source">
              <option value="blogs">Blogs & Guides (Community)</option>
              <option value="official">Official Docs (Microsoft)</option>
              <option value="all">All Sources</option>
            </select>
          </div>
          <div>
            <label for="topic-recency">Recency</label>
            <select id="topic-recency">
              <option value="">Any time</option>
              <option value="y">Past Year</option>
              <option value="m">Past Month</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="topic-search">Find Topics</button>
        </div>
      </section>
    </div>

    <script>
      const el = (id) => document.getElementById(id);

      const buildQuery = () => {
        const product = el("product").value;
        const version = el("version").value;
        const module = el("module").value;
        const keyword = el("keyword").value.trim();
        const scope = el("scope").value;

        const terms = [];
        terms.push('site:learn.microsoft.com');
        if (scope === "learn+community") {
          terms.push('OR site:community.dynamics.com');
        }
        terms.push(`"${product}"`);

        if (version) {
          terms.push(`"${version}"`);
        }

        if (module) {
          terms.push(`"${module}"`);
        }

        if (keyword) {
          terms.push(keyword);
        }

        if (el("status-new").checked) {
          terms.push('"what\'s new"');
        }
        if (el("status-deprecated").checked) {
          terms.push("deprecated");
        }
        if (el("status-removed").checked) {
          terms.push("removed");
        }
        if (el("status-changed").checked) {
          terms.push("changed");
        }

        return terms.join(" ");
      };

      const buildUrl = (query) => {
        const engine = el("engine").value;
        const q = encodeURIComponent(query);
        if (engine === "google") {
          return `https://www.google.com/search?q=${q}`;
        }
        if (engine === "ddg") {
          return `https://duckduckgo.com/?q=${q}`;
        }
        return `https://www.bing.com/search?q=${q}`;
      };

      const updatePreview = () => {
        const query = buildQuery();
        const url = buildUrl(query);
        el("preview").textContent = `Query: ${query} | URL: ${url}`;
      };

      document.addEventListener("input", updatePreview);

      el("search").addEventListener("click", () => {
        const url = buildUrl(buildQuery());
        window.open(url, "_blank", "noopener");
      });

      el("copy").addEventListener("click", async () => {
        const query = buildQuery();
        try {
          await navigator.clipboard.writeText(query);
          el("preview").textContent = "Query copied to clipboard.";
        } catch (error) {
          el("preview").textContent = "Copy failed. You can manually copy the query above.";
        }
      });

      // Topic Search Logic
      el("topic-search").addEventListener("click", () => {
        const keyword = el("topic-keyword").value.trim();
        const source = el("topic-source").value;
        const recency = el("topic-recency").value;
        const engine = el("engine").value;

        if (!keyword) {
          alert("Please enter a topic.");
          return;
        }

        const terms = [];
        terms.push('("Dynamics 365 Finance" OR "Dynamics 365 Supply Chain" OR "D365FO")');
        terms.push(`"${keyword}"`);

        if (source === "blogs") {
          terms.push('(blog OR guide OR tutorial OR "how to" OR walkthrough)');
        } else if (source === "official") {
          terms.push('site:learn.microsoft.com');
        }

        const query = terms.join(" ");
        const q = encodeURIComponent(query);
        let url = "";

        if (engine === "google") {
          url = `https://www.google.com/search?q=${q}`;
          if (recency) url += `&tbs=qdr:${recency}`;
        } else if (engine === "ddg") {
          url = `https://duckduckgo.com/?q=${q}`;
          if (recency) url += `&df=${recency}`;
        } else {
          // Bing
          url = `https://www.bing.com/search?q=${q}`;
          if (recency === "m") {
             url += "&filters=ex1%3a%22ez3%22"; // Past month
          }
        }

        window.open(url, "_blank", "noopener");
      });

      updatePreview();
    </script>
  </body>
</html>
